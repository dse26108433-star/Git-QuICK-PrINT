# ---------------------------------------------------------------
# Render "Blueprint": puts the backend online with HTTPS.
# render.com -> New -> Blueprint -> pick this repository.
# Render asks for each value marked sync: false (copy them from
# backend/.env). WEB_ORIGINS = your Netlify address.
# ---------------------------------------------------------------
services:
  - type: web
    name: campus-print-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # "free": costs nothing. It sleeps after 15 minutes without visitors; while
    # the Xerox PC is on it keeps it awake, so only the first visit of the
    # morning waits about a minute.
    # "starter" (paid) never sleeps: switch to it once students rely on it.
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # upi = CampusPay (docs/campuspay-upi.md), razorpay, or demo (tests only)
      - key: PAYMENT_MODE
        sync: false
      - key: UPI_ID
        sync: false
      - key: UPI_NAME
        sync: false
      - key: UPI_MERCHANT_CODE
        sync: false
      # The CampusPay Verifier app's password: Render makes a random one; copy it into the app.
      - key: UPI_ALERT_TOKEN
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: COUNTER_PASSWORD
        sync: false
      - key: AGENT_TOKEN_SECRET
        generateValue: true
      - key: WEB_ORIGINS
        sync: false

# ---------------------------------------------------------------
# The XeoGo websites on Netlify:
#   /            the student website
#   /staff.html  the staff website (college staff sign in and print for free)
#
# Two ways to put them online, both use THIS folder (web):
#   - by hand:  Netlify -> your site -> Deploys -> drag the whole "web" folder onto the page
#               (a new site: app.netlify.com/drop)
#   - by git:   connect the repository, base directory "web"; every push publishes
#
# The headers (security, caching) are in _headers and the redirects in _redirects, next to
# this file: Netlify reads those two in both cases.
#
# Before the first deploy: set apiBase in config.js to your backend's https:// address, and
# put this site's address (e.g. https://xeogo.netlify.app) in WEB_ORIGINS on the backend.
# ---------------------------------------------------------------
[build]
  publish = "."
